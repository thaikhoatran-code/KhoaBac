<style>
/* Layout: one-column phone ledger, sticky month header, bottom tab bar with a centre "ghi nhanh" button; sheets slide up for every input. */
:root{
  --bg:#FBF3EA; --surface:#FFFCF8; --sunk:#F3E8DB; --line:#EBDDCC;
  --fg:#3A2E27; --muted:#857466; --faint:#B3A393;
  --accent:#F2B33D; --accent-ink:#3A2E27; --accent-soft:#FCEBC4;
  --inc:#3D8B57; --inc-soft:#DDF0DF; --exp:#C9473F; --exp-soft:#FBE0DC;
  --warn:#B9771A; --warn-soft:#FCEBC9; --hero:#E7E5FA; --link:#D27A1E;
  --shadow:0 1px 2px rgba(90,60,30,.05),0 8px 22px rgba(120,80,40,.07);
  --f-display:"Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1714; --surface:#26201B; --sunk:#312922; --line:#3D332B;
  --fg:#F3E9DF; --muted:#B3A393; --faint:#7E6F62;
  --accent:#F2B33D; --accent-ink:#2A1F12; --accent-soft:#3E3018;
  --inc:#6CC488; --inc-soft:#1F3324; --exp:#F0837A; --exp-soft:#3D2220;
  --warn:#EBB052; --warn-soft:#3A2C14; --hero:#2C2A45; --link:#F2B33D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1714; --surface:#26201B; --sunk:#312922; --line:#3D332B;
  --fg:#F3E9DF; --muted:#B3A393; --faint:#7E6F62;
  --accent:#F2B33D; --accent-ink:#2A1F12; --accent-soft:#3E3018;
  --inc:#6CC488; --inc-soft:#1F3324; --exp:#F0837A; --exp-soft:#3D2220;
  --warn:#EBB052; --warn-soft:#3A2C14; --hero:#2C2A45; --link:#F2B33D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
header.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--inc-soft);color:var(--inc)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--exp-soft);color:var(--exp)}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px}
.monthsw button{border:0;background:none;width:30px;height:30px;border-radius:99px;cursor:pointer;color:var(--muted)}
.monthsw span{font-size:13px;font-weight:600;padding:0 4px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h a,.link{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--f-display);font-size:32px;font-weight:600;letter-spacing:-.5px;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.hero .rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent);padding-top:12px}
.hero .rows div{display:flex;flex-direction:column;min-width:0}
.hero .rows b{font-size:15px;font-variant-numeric:tabular-nums}
.hero .rows span{opacity:.8}
.hero a{color:inherit}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio small{color:var(--muted);font-size:12px}
.trio b{font-family:var(--f-display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--inc)} .neg{color:var(--exp)} .mut{color:var(--muted)} .wrn{color:var(--warn)}
.note{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.w{background:var(--warn)} .bar i.x{background:var(--exp)} .bar i.g{background:var(--inc)}
.rowlist{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rowlist>.row:first-child{border-top:0;padding-top:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:var(--f-display);letter-spacing:.3px}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:14px 2px 6px;font-weight:600;letter-spacing:.2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--sunk);color:var(--fg)}
.btn.ghost{background:none;color:var(--accent);padding:8px 10px}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.f input,.f select,.f textarea,.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--fg);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{font-size:19px !important;padding:14px !important;font-weight:500}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border:0;padding:0;background:none}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;color:var(--faint);cursor:pointer;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:10px;transform:translateY(-12px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer}
.fab svg{width:28px;height:28px}
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--exp-soft);color:var(--exp)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .main{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.grid-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mi b{font-size:15px}
.mi span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.askbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:22;background:var(--bg);padding:8px 0}
.askbar .row2{max-width:560px;margin:0 auto;display:flex;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.preview{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.preview span{background:var(--sunk);border-radius:8px;padding:4px 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.recap-ai{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.hint{font-size:12px;color:var(--faint)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.tag.g{background:var(--inc-soft);color:var(--inc)} .tag.r{background:var(--exp-soft);color:var(--exp)} .tag.y{background:var(--warn-soft);color:var(--warn)}
@media (max-width:370px){.trio b{font-size:15px}.hero .big{font-size:28px}}

/* ---- giao diện theo mẫu: nền kem, ô màu pastel, icon minh hoạ ---- */
body{font-weight:600;font-size:15px}
h1{font-weight:900;letter-spacing:-.3px} h2{font-weight:800}
.card{border-radius:22px;border:1px solid var(--line);box-shadow:none}

.bunny.emo{display:inline-grid;place-items:center;background:linear-gradient(160deg,#FFF6EE,#F6E3D3)}
.bunny{flex:none;display:inline-block;object-fit:cover;border-radius:30%;border:3px solid var(--surface);box-shadow:0 4px 12px rgba(90,50,30,.18);background:var(--sunk)}
.buddy{display:flex;align-items:flex-end;gap:6px;padding:2px 4px 0}

.bubble::before{content:"";position:absolute;left:-7px;top:calc(50% - 6px);width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble b{font-weight:900;font-size:15px}
.bubble span{font-size:13.5px;color:var(--muted)}
.buddy.grumpy .bubble b{color:var(--exp)} .buddy.flex .bubble b{color:var(--inc)}
.peek{position:relative;padding-top:26px}

/* ---------- Linh vật: thỏ trắng ---------- */
const BN=(window.SOTIEN_CONFIG&&window.SOTIEN_CONFIG.mascot)||{};
function bunny(mood='happy',size=96){
  const L=S.look||{};const src=mood==='grumpy'?(L.grumpy||BN.grumpy):(L.flex||BN.flex);
  if(!src)return`<span class="bunny emo b-${mood}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.55)}px" aria-hidden="true">${mood==='grumpy'?'😾':mood==='flex'?'💪':'🐰'}</span>`;
  return`<img class="bunny b-${mood}" src="${src}" width="${size}" height="${size}" alt="" aria-hidden="true">`;
}
function bunnySays(){
  const s=monthStats(curYM());const over=budgetRows(curYM()).filter(r=>r.p>=1);
  const late=S.meta.bills.filter(b=>{const x=billStatus(b);return!x.paid&&x.d<0});
  const todayExp=sum(M().all.filter(t=>t.date===today()&&t.type==='exp'),t=>t.amount);
  const rate=s.inc?s.net/s.inc:0;
  if(over.length)return{mood:'grumpy',title:'Ê, khoan đã!',text:`${over[0].c.name} vượt ngân sách ${fmt(over[0].spent-over[0].lim)} rồi đó. Bớt lại chút nha bạn.`};
  if(late.length)return{mood:'grumpy',title:'Quên gì không?',text:`${late[0].name} quá hạn rồi. Đóng đi kẻo bị phạt.`};
  if(s.inc&&rate>=.3)return{mood:'flex',title:'Khoẻ re!',text:`Tháng này để dành được ${Math.round(rate*100)}% thu nhập. Cơ bắp tài chính đây.`};
  if(M().owedMe>0&&new Date().getDate()>=25)return{mood:'grumpy',title:'Đòi nợ đi bạn',text:`Người khác còn nợ bạn ${fmt(M().owedMe)}. Cuối tháng rồi đó.`};
  if(!todayExp)return{mood:'happy',title:'Hôm nay sao rồi?',text:'Bạn chưa ghi khoản nào hôm nay. Bấm nút + kể em nghe đi.'};
  return{mood:'happy',title:'Ổn áp',text:`Hôm nay bạn đã chi ${fmt(todayExp)}. Cứ đều đều vậy là đẹp.`};
}

/* ---------- Trạng thái & lưu trữ ---------- */
const blank=()=>({meta:{accounts:[],jobs:[],budgets:{},bills:[],settings:{}},splits:{list:[]},recaps:{map:{}},look:{},tx:{}});
let S=blank();
let ver=0;
const st={mode:'init',col:null,dirty:new Set(),timers:{},writing:{},again:{},demo:false,real:null,sample:null,downloads:null};
let CACHE_KEY='sotien-cache-guest';
function docNames(){return['meta','splits','recaps','look',...Object.keys(S.tx).map(k=>'tx-'+k)]}
function docData(n){if(n==='meta')return S.meta;if(n==='splits')return S.splits;if(n==='recaps')return S.recaps;if(n==='look')return S.look;return S.tx[n.slice(3)]||{items:[]}}
function applyDoc(n,d){if(!d)return;if(n==='meta')S.meta=Object.assign(blank().meta,d);else if(n==='splits')S.splits={list:d.list||[]};else if(n==='recaps')S.recaps={map:d.map||{}};else if(n==='look')S.look=d||{};else if(n.startsWith('tx-'))S.tx[n.slice(3)]={items:d.items||[]}}
function writeCache(){if(st.demo||!st.user)return;try{localStorage.setItem(CACHE_KEY,JSON.stringify({from:st.mode==='db'?'db':'local',S}))}catch(e){}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return c&&c.S?c:null}catch(e){return null}}
function save(...names){
  ver++;
  if(st.demo){render();return}
  writeCache();
  if(st.mode==='db')for(const n of names){st.dirty.add(n);clearTimeout(st.timers[n]);st.timers[n]=setTimeout(()=>flush(n),350)}
  render();
}
async function flush(n){
  if(st.writing[n]){st.again[n]=true;return}
  st.writing[n]=true;renderStatus();
  try{const{error}=await sb.from('docs').upsert({user_id:st.user.id,name:n,data:JSON.parse(JSON.stringify(docData(n))),updated_at:new Date().toISOString()},{onConflict:'user_id,name'});if(error)throw error}
  catch(e){console.error(e);toast('Chưa lưu được lên máy chủ. Kiểm tra mạng, app sẽ thử lại khi bạn sửa tiếp.')}
  st.writing[n]=false;
  if(st.again[n]){st.again[n]=false;flush(n);return}
  st.dirty.delete(n);renderStatus();
}
/* ---------- Đăng nhập (Supabase) ---------- */
const CFG=window.SOTIEN_CONFIG||{};
const sb=(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
st.user=null;st.auth='login';
async function loadAll(){
  const{data,error}=await sb.from('docs').select('name,data');
  if(error){toast('Không tải được dữ liệu. Kiểm tra mạng rồi tải lại trang.');st.mode='local';render();return}
  const fresh=blank();const keep=S;S=fresh;
  for(const r of data||[])if(!st.dirty.has(r.name))applyDoc(r.name,r.data);else{const k=keep;S[r.name]=k[r.name]}
  st.mode='db';ver++;writeCache();render();
}
async function setUser(u){
  const changed=(st.user&&st.user.id)!==(u&&u.id);
  st.user=u||null;
  if(!u){S=blank();ver++;st.mode='auth';st.auth='login';render();return}
  if(changed){
    CACHE_KEY='sotien-cache-'+u.id;
    const c=readCache();S=c?Object.assign(blank(),c.S):blank();ver++;
    st.mode='init';render();await loadAll();
  }
}
async function initStore(){
  if(!sb){st.mode='noconfig';render();return}
  const{data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){st.auth='reset';st.mode='auth';st.recovering=true;render();return}
    if(st.recovering)return;
    setUser(session&&session.user);
  });
  await setUser(data.session&&data.session.user);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.user&&st.mode==='db'&&!st.dirty.size)loadAll()});
}
const displayName=()=>{const u=st.user;return(u&&u.user_metadata&&u.user_metadata.name)||(u&&u.email?u.email.split('@')[0]:'bạn')};

   </form></div>`;
}
async function submitAuth(e){
  e.preventDefault();const m=st.auth;const msg=$('#auMsg'),btn=$('#auBtn');
  const email=($('#auEmail')||{}).value?.trim(),pass=($('#auPass')||{}).value,name=($('#auName')||{}).value?.trim();
  const say=(t,bad)=>{msg.textContent=t;msg.style.color=bad?'var(--exp)':'var(--inc)'};
  if(m!=='reset'&&!/^\S+@\S+\.\S+$/.test(email||''))return say('Email chưa đúng định dạng.',1);
  if(m!=='forgot'&&(!pass||pass.length<6))return say('Mật khẩu cần ít nhất 6 ký tự.',1);
  if(m==='signup'&&!name)return say('Nhập tên để app biết gọi bạn là gì.',1);
  btn.disabled=true;say('Đang xử lý…');
  try{

let memo={v:-1};
function M(){
  if(memo.v===ver)return memo;
  const all=Object.values(S.tx).flatMap(d=>d.items||[]).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  const bal={};for(const a of S.meta.accounts)bal[a.id]=+a.opening||0;
  const ppl={},jobs={};
  for(const j of S.meta.jobs)jobs[j.id]={adv:0,ref:0,items:[]};
  for(const t of all){
    const s=TYPES[t.type]?.sign||0;
    if(t.type==='xfer'){if(t.acc in bal)bal[t.acc]-=t.amount;if(t.toAcc in bal)bal[t.toAcc]+=t.amount}
    else if(t.acc&&t.acc in bal)bal[t.acc]+=s*t.amount;
    if(DEBT_SIGN[t.type]&&t.person){
      const k=lc(t.person).trim();const p=ppl[k]||(ppl[k]={key:k,name:t.person,bal:0,items:[],due:null});
      p.bal+=DEBT_SIGN[t.type]*t.amount;p.items.push(t);
      if(t.due&&(t.type==='lend'||t.type==='borrow'))p.due=p.due&&p.due<t.due?p.due:t.due;
    }
    if((t.type==='adv'||t.type==='ref')&&t.jobId){const j=jobs[t.jobId]||(jobs[t.jobId]={adv:0,ref:0,items:[]});j[t.type]+=t.amount;j.items.push(t)}
  }
  const accTotal=sum(S.meta.accounts,a=>bal[a.id]);
  const plist=Object.values(ppl).sort((a,b)=>Math.abs(b.bal)-Math.abs(a.bal));
  const owedMe=sum(plist.filter(p=>p.bal>0),p=>p.bal),iOwe=-sum(plist.filter(p=>p.bal<0),p=>p.bal);
  const jobOut=sum(S.meta.jobs.filter(j=>!j.closed),j=>Math.max(0,(jobs[j.id]?.adv||0)-(jobs[j.id]?.ref||0)));
  const creditDebt=-sum(S.meta.accounts.filter(a=>a.type==='credit'),a=>Math.min(0,bal[a.id]));
  memo={v:ver,all,bal,ppl:plist,jobs,accTotal,owedMe,iOwe,jobOut,creditDebt,net:accTotal+jobOut+owedMe-iOwe};
  return memo;
}

function parseQuick(raw){
  let o=' '+String(raw||'').normalize('NFC').replace(/\s+/g,' ').trim()+' ';
  const r={};
  // ngày
  const t0=today();
  const rel=[[/\s(hôm qua|hqua|hq)(?=\s)/iu,-1],[/\s(hôm kia)(?=\s)/iu,-2],[/\s(hôm nay|nay)(?=\s)/iu,0]];
  for(const[re,k]of rel){if(re.test(o)){r.date=addDays(t0,k);o=o.replace(re,' ');break}}
  const dm=o.match(/\s(?:ngày\s)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/u);
  if(dm){let y=dm[3]?+dm[3]:new Date().getFullYear();if(y<100)y+=2000;const d=y+'-'+pad(+dm[2])+'-'+pad(+dm[1]);if(!isNaN(new Date(d)))r.date=d;o=o.replace(dm[0],' ')}
  // số tiền
  const ams=[...o.matchAll(/(?<![\p{L}\d])(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s?(triệu|tr|củ|m|tỷ|nghìn|ngàn|k|n|đ|d|vnd|vnđ)?(\d{1,3})?(?![\p{L}\d])/giu)];
  const am=ams.find(x=>x[2])||ams.sort((a,b)=>b[1].length-a[1].length)[0];
  if(am){
    let numS=am[1],unit=lc(am[2]||''),tail=am[3]||'';let v;
    if(/^\d{1,3}([.,]\d{3})+$/.test(numS)&&!unit)v=+numS.replace(/[.,]/g,'');
    else v=parseFloat(numS.replace(',','.'));
    const mul={'triệu':1e6,tr:1e6,'củ':1e6,m:1e6,'tỷ':1e9,'nghìn':1e3,'ngàn':1e3,k:1e3,n:1e3,'đ':1,d:1,vnd:1,'vnđ':1}[unit];
    if(mul){v*=mul;if(tail&&mul>=1e6)v+=parseFloat('0.'+tail)*mul;else if(tail&&mul===1e3)v+=+tail}
    else if(v<1000)v*=1000;
    r.amount=Math.round(v);o=o.replace(am[0],' ');
  }
  // ví
  const ol=lc(o);
  for(const a of S.meta.accounts){const n=lc(a.name);if(n.length>1&&kwRe(n).test(ol)){r.acc=a.id;o=o.replace(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'iu'),' ');break}}
  if(!r.acc)for(const[ty,al]of Object.entries(ACC_ALIAS)){const hit=al.find(k=>kwRe(k).test(lc(o)));if(hit){const a=S.meta.accounts.find(x=>x.type===ty);if(a){r.acc=a.id;o=o.replace(kwRe(hit),' ')}break}}
  o=o.replace(/\s+/g,' ').trim();
  const known=new Set(M().ppl.map(p=>p.key));
  let m;
  if(m=o.match(/^(?:nhận\s)?(?:hoàn ứng|hoàn tiền ứng|hoàn job|hoàn)(?:\s(?:job|cho job|từ job))?\s*(.*)$/iu)){r.type='ref';r.jobText=m[1].trim()}
  else if(m=o.match(/^(?:tạm ứng|ứng trước|ứng)(?:\s(?:job|cho job|cho))?\s*(.*)$/iu)){r.type='adv';r.jobText=m[1].trim()}
  else if(m=o.match(/^cho\s(.+?)\s(?:mượn|vay)(?:\s(.*))?$/iu)){r.type='lend';r.person=m[1];r.note=m[2]}
  else if(m=o.match(/^(?:mượn|vay)\s(?:của\s|tiền\s)?(.+)$/iu)){r.type='borrow';r.person=m[1]}
  else if(m=o.match(/^thu nợ\s(.+)$/iu)){r.type='collect';r.person=m[1]}
  else if((m=o.match(/^trả nợ\s(.+)$/iu))||((m=o.match(/^trả(?:\slại)?\s(.+)$/iu))&&known.has(lc(m[1]).trim()))){r.type='repay';r.person=m[1]}
  else if((m=o.match(/^(.+?)\s(?:trả nợ|trả lại)(?:\s.*)?$/iu))||((m=o.match(/^(.+?)\strả(?:\s.*)?$/iu))&&known.has(lc(m[1]).trim()))){r.type='collect';r.person=m[1]}
  else if(m=o.match(/^(?:chuyển|ck)\s(?:sang|qua|vào)\s(.+)$/iu)){r.type='xfer';const a=S.meta.accounts.find(x=>lc(m[1]).includes(lc(x.name)));if(a)r.toAcc=a.id}
  const text=lc(o);
  if(!r.type){
    const ic=bestCat(INC_CATS,text);
    if(ic&&!bestCat(EXP_CATS,text,true)){r.type='inc';r.cat=ic}else{r.type='exp';r.cat=bestCat(EXP_CATS,text)||'khac'}
  }
  if(r.type==='inc'&&!r.cat)r.cat=bestCat(INC_CATS,text)||'thukhac';
  if(r.person)r.person=capFirst(r.person.trim());
  if(r.jobText!==undefined){
    const jt=lc(r.jobText);const j=jt&&S.meta.jobs.find(x=>{const n=lc(x.name);return jt.includes(n)||n.includes(jt)});
    if(j)r.jobId=j.id;else if(r.jobText)r.newJob=capFirst(r.jobText);
  }
  if(r.note===undefined)r.note=(r.type==='exp'||r.type==='inc')?capFirst(o):'';
  return r;
}
function bestCat(list,text,strongOnly){
  let best=null,len=0;
  for(const c of list)for(const k of c.kw){if(strongOnly&&k.length<4)continue;if(k.length>len&&kwRe(k).test(text)){best=c.id;len=k.length}}
  return best;
}

  ${bills.map(x=>`<div class="banner ${x.d<0?'bad':'warn'}"><div class="main"><b>${esc(x.b.name)}</b> ${x.d<0?'quá hạn '+(-x.d)+' ngày':x.d===0?'đến hạn hôm nay':'còn '+x.d+' ngày'} · ${fmt(x.b.amount)}</div><button class="btn sm sec" data-act="pay-bill" data-id="${x.b.id}">Đã đóng</button></div>`).join('')}

VIEWS.txns=()=>{
  let tx=monthTx(viewYM);
  const fl={all:'Tất cả',exp:'Chi',inc:'Thu',job:'Job',debt:'Nợ',xfer:'Chuyển ví'};
  if(filt.type==='job')tx=tx.filter(t=>t.type==='adv'||t.type==='ref');
  else if(filt.type==='debt')tx=tx.filter(t=>DEBT_SIGN[t.type]);
  else if(filt.type!=='all')tx=tx.filter(t=>t.type===filt.type);
  if(filt.cat)tx=tx.filter(t=>t.cat===filt.cat);
  const q=lc(filt.q).trim();
  if(q)tx=tx.filter(t=>lc([t.note,CAT[t.cat]?.name,t.person,jobName(t.jobId),accName(t.acc)].join(' ')).includes(q));
  const days={};for(const t of tx)(days[t.date]||(days[t.date]=[])).push(t);
  const s=monthStats(viewYM);
  return hdr('Sổ thu chi',{month:true})+`<div class="stack">
  <div class="trio card"><div><small>Thu</small><b class="pos">${fmtS(s.inc)}</b></div><div><small>Chi</small><b class="neg">${fmtS(s.exp)}</b></div><div><small>Giao dịch</small><b>${s.count}</b></div></div>
  <input id="q" class="in" placeholder="Tìm: cafe, Candid, MoMo…" value="${esc(filt.q)}" data-act="q" autocomplete="off">
  <div class="chips">${Object.entries(fl).map(([k,v])=>`<button class="chip${filt.type===k?' on':''}" data-act="ft" data-k="${k}">${v}</button>`).join('')}${filt.cat?`<button class="chip on" data-act="fc-clear">${esc(CAT[filt.cat]?.name)} ✕</button>`:''}</div>
  <div>${Object.keys(days).length?Object.entries(days).map(([d,items])=>{const e=sum(items.filter(t=>t.type==='exp'),t=>t.amount);const ic=sum(items.filter(t=>t.type==='inc'),t=>t.amount);return`<div class="dayh"><span class="dp">${dayLabel(d)}</span><span class="num">${ic?'<span class="pos">+'+fmt(ic)+'</span>  ':''}${e?'<span class="neg">−'+fmt(e)+'</span>':''}</span></div><div class="rowlist">${items.map(t=>txRow(t)).join('')}</div>`}).join(''):`<div class="empty card">Không có giao dịch nào khớp.</div>`}</div></div>`;
};

  <section class="card"><div class="card-h"><h2>Tổng chi tháng</h2><span class="num"><b>${fmtS(s.exp)}</b> <span class="mut">/ ${totalLim?fmtS(totalLim):'chưa đặt'}</span></span></div>
   ${totalLim?`<div class="bar"><i class="${s.exp/totalLim>=1?'x':s.exp/totalLim>=.8?'w':''}" style="width:${Math.min(100,s.exp/totalLim*100)}%"></i></div>`:''}
   <p class="hint" style="margin:8px 0 0">Thu nhập trung bình 6 tháng: ${fmt(incomeStats().avg)}. Em cảnh báo khi một nhóm dùng tới 80%.</p></section>
  <section class="card">${rows.length?rows.map(r=>budgetBar(r,viewYM)).join(''):`<div class="empty">Chưa đặt hạn mức nào. Điền số tiền cho các nhóm bên dưới.</div>`}</section>
  <section class="card"><div class="card-h"><h2>Hạn mức mỗi tháng</h2></div><div class="stack" style="gap:10px">

   ${EXP_CATS.map(c=>`<label class="f" style="flex-direction:row;align-items:center;gap:10px">${icon(c)}<span style="flex:1;color:var(--fg);font-size:14px">${esc(c.name)}<br><span class="hint">Tháng này ${fmtS(s.byCat[c.id]||0)}</span></span><input id="bg-${c.id}" style="width:120px" inputmode="numeric" data-act="bg" data-k="${c.id}" value="${b[c.id]?fmtN(b[c.id]):''}" placeholder="—"></label>`).join('')}
  </div></section></div>`;
};
function debtSummary(){const m=M();return`<section class="card"><div class="trio"><div><small>Người khác nợ bạn</small><b class="pos">${fmtS(m.owedMe)}</b></div><div><small>Bạn đang nợ</small><b class="neg">${fmtS(m.iOwe)}</b></div><div><small>Job chưa hoàn</small><b class="wrn">${fmtS(m.jobOut)}</b></div></div></section>

VIEWS.debts=()=>{

  const row=p=>`<button class="row" data-go="person" data-arg="${esc(p.key)}">${icon({ab:p.name.slice(0,2).toUpperCase(),c:p.bal>0?'#0B8457':p.bal<0?'#C23B33':'#868E96'})}<div class="main"><div class="t">${esc(p.name)}</div><div class="s">${p.bal>0?'Nợ bạn':p.bal<0?'Bạn nợ':'Đã xong'}${p.due&&p.bal?' · hẹn '+short(p.due):''} · ${p.items.length} lần</div></div><div class="amt ${p.bal>0?'pos':p.bal<0?'neg':'mut'}">${fmt(Math.abs(p.bal))}</div></button>`;
  return hdr('Nợ & tạm ứng')+`<div class="stack">${debtSummary()}
  <div class="btns"><button class="btn sm" data-act="debt-new" data-k="lend">Cho mượn</button><button class="btn sm sec" data-act="debt-new" data-k="borrow">Đi mượn</button><button class="btn sm sec" data-go="split">Chia tiền nhóm</button></div>

VIEWS.person=()=>{

VIEWS.jobs=()=>{
  const m=M();const jobs=S.meta.jobs.slice().sort((a,b)=>(a.closed?1:0)-(b.closed?1:0)||(b.created||0)-(a.created||0));

function shrinkImage(file,maxW,maxH,square){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let sx=0,sy=0,sw=img.width,sh=img.height;
    if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
    const k=Math.min(1,maxW/sw,maxH/sh);const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
    c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.8))};
    img.onerror=()=>rej(new Error('Không đọc được ảnh'));img.src=URL.createObjectURL(file)});
}

    root.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{locked.add('type');setType(b.dataset.ty)});
    const amt=$$('#fAmt'),date=$$('#fDate'),note=$$('#fNote');
    amt.value=t.amount?fmtN(t.amount):'';date.value=t.date;note.value=t.note||'';
    amt.oninput=()=>{locked.add('amount')};date.oninput=()=>{t.date=date.value;locked.add('date')};note.oninput=()=>{t.note=note.value;locked.add('note')};
    setType(t.type);
    const q=$$('#qIn');
    if(q){
      q.addEventListener('input',()=>{
        const r=parseQuick(q.value);
        if(!locked.has('type')&&r.type!==t.type){t.type=r.type}
        if(r.amount&&!locked.has('amount'))amt.value=fmtN(r.amount);
        if(r.cat&&!locked.has('cat'))t.cat=r.cat;
        if(r.acc&&!locked.has('acc'))t.acc=r.acc;else if(!locked.has('acc'))t.acc=defAcc();
        if(r.toAcc&&!locked.has('toAcc'))t.toAcc=r.toAcc;
        if(r.date&&!locked.has('date')){t.date=r.date;date.value=r.date}
        if(!locked.has('person'))t.person=r.person||'';
        if(!locked.has('job')){t.jobId=r.jobId||null;t.newJob=r.newJob||''}
        if(!locked.has('note')){t.note=r.note||'';note.value=t.note}
        setType(t.type);
      });
      q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$$('#fSave').click()}});
      setTimeout(()=>q.focus(),60);
    }
    const rc=$$('#fRc');
    if(rc)rc.onchange=async()=>{
      const f=rc.files[0];if(!f)return;const lbl=$$('#rcLbl');lbl.textContent='Đang đọc hoá đơn…';
      try{
        const r=await st.sample.json(`Đây là ảnh hoá đơn/biên lai ở Việt Nam. Trả về JSON đúng dạng {"amount": số tiền tổng phải trả (VND, số nguyên), "merchant": "tên cửa hàng", "date": "YYYY-MM-DD hoặc null", "category": một trong [${EXP_CATS.map(c=>c.id).join(', ')}] với nghĩa ${EXP_CATS.map(c=>c.id+'='+c.name).join(', ')}}. Chỉ trả JSON.`,{images:[f],modelTier:'quick'});
        if(r&&r.amount){amt.value=fmtN(+r.amount);locked.add('amount')}
        if(r&&r.category&&CAT[r.category]){t.cat=r.category;locked.add('cat')}
        if(r&&r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)){t.date=r.date;date.value=r.date;locked.add('date')}
        if(r&&r.merchant){t.note=r.merchant;note.value=r.merchant;locked.add('note')}
        t.type='exp';locked.add('type');setType('exp');lbl.textContent='Đã đọc xong, bạn kiểm tra lại';
      }catch(e){lbl.textContent=e&&e.code==='not_granted'?'Chưa được phép hỏi Claude':'Không đọc được ảnh, bạn nhập tay giúp em'}
    };
    $$('#fSave').onclick=()=>{
      const v=parseMoney(amt.value);
      if(!(v>0)){toast('Bạn nhập số tiền giúp em (vd 45k).');amt.focus();return}
      const out={id:t.id,ts:t.ts,type:t.type,amount:v,date:date.value||today(),note:note.value.trim()};
      const k=t.type;
      if(k==='exp'||k==='inc'){out.cat=t.cat;out.acc=t.acc||''}
      else if(k==='xfer'){out.acc=t.acc;out.toAcc=t.toAcc||$$('#fTo').value;if(out.acc===out.toAcc){toast('Chọn hai ví khác nhau.');return}}
      else if(k==='adv'||k==='ref'){
        out.acc=t.acc;let jid=t.jobId&&t.jobId!=='__new'?t.jobId:null;
        if(!jid){const nm=($$('#fNewJob')?.value||'').trim();if(!nm){toast('Đặt tên cho job mới.');return}const j={id:uid(),name:nm,created:Date.now()};S.meta.jobs.push(j);jid=j.id}
        out.jobId=jid;
      }else{
        const p=($$('#fPerson')?.value||'').trim();if(!p){toast('Nhập tên người.');return}
        const ex=M().ppl.find(x=>x.key===lc(p));out.person=ex?ex.name:capFirst(p);out.acc=t.acc||'';const d=$$('#fDue')?.value;if(d)out.due=d;
      }
      if(t.splitId)out.splitId=t.splitId;
      const docs=[];if(out.id){const old=removeTx(out.id);if(old)docs.push(old.doc)}docs.push(addTx(out));
      if(k==='adv'||k==='ref')docs.push('meta');
      closeSheet();save(...new Set(docs));
      toast((isNew?'Đã ghi ':'Đã sửa ')+TYPES[k].label.toLowerCase()+' '+fmt(v));
      if(isNew&&k==='exp')budgetCheck(out);
    };
    const del=$$('#fDel');if(del)del.onclick=()=>{closeSheet();deleteTx(t.id)};
  });
}
function budgetCheck(t){
  const lim=(S.meta.budgets||{})[t.cat];if(!lim)return;const ym=t.date.slice(0,7);const s=monthStats(ym).byCat[t.cat]||0;const p=s/lim;
  if(p>=1)setTimeout(()=>toast(`${CAT[t.cat].name} đã vượt ngân sách tháng (${fmtS(s)}/${fmtS(lim)}).`),900);
  else if(p>=.8)setTimeout(()=>toast(`${CAT[t.cat].name} đã dùng ${Math.round(p*100)}% ngân sách tháng.`),900);
}

function splitForm(){

  const people=[...new Set(M().ppl.map(p=>p.name))];
  let rows=[{name:'',share:0},{name:'',share:0}];let mode='equal';

      g('#sRows').innerHTML=`<div style="display:grid;grid-template-columns:1fr 110px 32px;gap:8px;align-items:center"><span style="padding-left:4px;font-weight:600">Bạn</span><span class="num" style="text-align:right;padding-right:4px">${fmt(mine)}</span><span></span></div>`+rows.map((r,i)=>`<div style="display:grid;grid-template-columns:1fr 110px 32px;gap:8px;align-items:center"><input class="in" data-i="${i}" data-f="name" list="pplList2" value="${esc(r.name)}" placeholder="Tên người ${i+1}"><input class="in num" data-i="${i}" data-f="share" inputmode="decimal" value="${r.share?fmtN(r.share):''}" ${mode==='equal'?'disabled':''} style="text-align:right"><button class="btn ghost sm" data-rm="${i}" aria-label="Bỏ người này" style="padding:4px">✕</button></div>`).join('');

        if(mine>0){docs.add(addTx({type:'exp',amount:mine,cat,acc:'',date,note:title+' ('+payer+' trả)',splitId:sid}));docs.add(addTx({type:'borrow',amount:mine,person:payer,acc:'',date,note:'Chia: '+title,splitId:sid}))}
      }
      S.splits.list.push({id:sid,title,total,date,payer:isMe()?'me':capFirst(g('#sPayer').value.trim()),myShare:mine,people:ppl.map(r=>({name:r.name.trim(),share:r.share}))});
      closeSheet();save(...docs);toast('Đã chia '+fmt(total));
    };
  });
}

function monthSummary(ym){const s=monthStats(ym);return{thang:ym,thu:s.inc,chi:s.exp,chi_theo_nhom:Object.fromEntries(Object.entries(s.byCat).map(([k,v])=>[CAT[k]?.name||k,v])),thu_theo_nhom:Object.fromEntries(Object.entries(s.incCat).map(([k,v])=>[CAT[k]?.name||k,v])),so_giao_dich:s.count}}
function filterTx(a){
  let tx=M().all;
  if(a.tu_ngay)tx=tx.filter(t=>t.date>=a.tu_ngay);if(a.den_ngay)tx=tx.filter(t=>t.date<=a.den_ngay);
  if(a.loai)tx=tx.filter(t=>t.type===a.loai);
  if(a.nhom){const n=lc(a.nhom);tx=tx.filter(t=>lc(CAT[t.cat]?.name).includes(n)||t.cat===a.nhom)}
  if(a.tu_khoa){const k=lc(a.tu_khoa);tx=tx.filter(t=>lc([t.note,t.person,jobName(t.jobId),CAT[t.cat]?.name].join(' ')).includes(k))}
  return{so_luong:tx.length,tong_tien:sum(tx,t=>t.amount),giao_dich:tx.slice(0,80).map(t=>({ngay:t.date,loai:TYPES[t.type].label,so_tien:t.amount,nhom:CAT[t.cat]?.name,ghi_chu:t.note,vi:accName(t.acc),nguoi:t.person,job:t.jobId?jobName(t.jobId):undefined}))};
}
const AI_TOOLS=[
 {name:'tong_quan',description:'Tổng quan hiện tại: số dư từng ví, tài sản ròng, ai nợ ai, tạm ứng job, ngân sách tháng này, hoá đơn định kỳ, thu nhập và chi tiêu 6 tháng.',inputSchema:{type:'object',properties:{}},execute:()=>overview()},
 {name:'thong_ke_thang',description:'Tổng thu, tổng chi và chi tiết theo nhóm của một tháng.',inputSchema:{type:'object',properties:{thang:{type:'string',description:'Dạng YYYY-MM'}},required:['thang']},execute:a=>monthSummary(String(a.thang||curYM()))},
 {name:'tim_giao_dich',description:'Lọc giao dịch theo ngày, loại, nhóm hoặc từ khoá. Trả về số lượng, tổng tiền và tối đa 80 giao dịch mới nhất.',inputSchema:{type:'object',properties:{tu_ngay:{type:'string',description:'YYYY-MM-DD'},den_ngay:{type:'string',description:'YYYY-MM-DD'},loai:{type:'string',enum:Object.keys(TYPES),description:'exp=chi, inc=thu, adv=ứng job, ref=hoàn ứng, lend=cho mượn, borrow=đi mượn, collect=thu nợ, repay=trả nợ, xfer=chuyển ví'},nhom:{type:'string',description:'Tên nhóm, vd Cafe, Ăn uống, Đi lại'},tu_khoa:{type:'string'}}},execute:a=>filterTx(a||{})}
];
const AI_INTRO=()=>`Bạn là trợ lý tài chính cá nhân trong app "KhoaBạc" của bạn Khoa (làm Fieldwork Ops ở công ty tổ chức sự kiện tại TP.HCM, thu nhập gồm lương + thưởng dự án + OT cuối tuần, hay tạm ứng tiền cho job rồi được công ty hoàn). Xưng "em", gọi "bạn". Hôm nay là ${today()}. Luôn dùng công cụ để lấy số liệu thật, không đoán. Tiền ứng job và cho mượn không phải chi tiêu cá nhân. Trả lời ngắn gọn bằng tiếng Việt, dạng vài dòng hoặc gạch đầu dòng, số tiền viết kiểu 45.000đ hoặc 1,2 triệu. Không dùng markdown đậm/nghiêng.`;
async function ask(q){
  q=q.trim();if(!q||asking||!st.sample)return;
  chat.push({role:'user',content:q});const ans={role:'assistant',content:''};chat.push(ans);asking=true;render();
  const msgs=chat.slice(0,-1).map((c,i)=>({role:c.role,content:i===0?AI_INTRO()+'\n\nCâu hỏi: '+c.content:c.content}));
  try{
    const r=await st.sample(msgs,{tools:AI_TOOLS,cache:false,onText:u=>{ans.content=u.text;const els=document.querySelectorAll('.msg.ai');const el=els[els.length-1];if(el)el.textContent=u.text}});
    ans.content=r.text||'Em chưa có câu trả lời.';
  }catch(e){ans.content=e&&e.code==='not_granted'?'Bạn chưa cho phép trang này hỏi Claude. Mở menu Quyền của trang để bật.':e&&e.code==='rate_limited'?'Em đang bị giới hạn lượt hỏi, bạn thử lại sau ít phút.':'Em gặp lỗi khi trả lời. Bạn thử hỏi lại nhé.'+(e&&e.text?'\n\n'+e.text:'')}
  asking=false;render();
}
async function recapAI(ym){
  if(!st.sample||recapBusy)return;recapBusy=true;render();
  const R=recapData(ym),I=incomeStats();
  const data={thang:ym,thu:R.inc,chi:R.exp,chi_thang_truoc:R.prevExp,thu_thang_truoc:R.prevInc,top_nhom:R.top,vuot_ngan_sach:R.over,ngan_sach:Object.fromEntries(EXP_CATS.filter(c=>S.meta.budgets[c.id]).map(c=>[c.name,S.meta.budgets[c.id]])),thu_nhap_tb_6_thang:Math.round(I.avg),chi_tb_6_thang:Math.round(I.avgExp),job_chua_hoan:M().jobOut,nguoi_khac_no:M().owedMe,anh_dang_no:M().iOwe,
    giao_dich_chi_lon:monthTx(ym).filter(t=>t.type==='exp').sort((a,b)=>b.amount-a.amount).slice(0,12).map(t=>({ngay:t.date,so_tien:t.amount,nhom:CAT[t.cat]?.name,ghi_chu:t.note}))};
  try{
    const r=await st.sample(`${AI_INTRO()}\n\nViết bản tổng kết ${ymLabel(ym).toLowerCase()} cho bạn dựa trên số liệu JSON dưới đây. Gồm: 1 câu nhận xét chung; 3 điểm đáng chú ý (tăng/giảm, vượt ngân sách, khoản lớn); 3 gợi ý cắt giảm cụ thể kèm số tiền ước tính tiết kiệm được mỗi tháng; 1 việc cần làm với tiền treo (job chưa hoàn, người nợ) nếu có. Dùng gạch đầu dòng "• ", tối đa 14 dòng.\n\n${JSON.stringify(data)}`,{modelTier:'default'});
    S.recaps.map[ym]={text:r.text,at:Date.now()};recapBusy=false;save('recaps');
  }catch(e){recapBusy=false;toast(e&&e.code==='not_granted'?'Bạn chưa cho phép trang hỏi Claude.':'Chưa viết được tổng kết, bạn thử lại sau.');render()}
}

/* ---------- Xuất CSV ---------- */
async function exportCsv(){
  const rows=[['Ngày','Loại','Số tiền','Nhóm','Ví','Sang ví','Người','Job','Ghi chú']];
  for(const t of M().all.slice().reverse())rows.push([t.date,TYPES[t.type].label,t.amount,CAT[t.cat]?.name||'',accName(t.acc),t.toAcc?accName(t.toAcc):'',t.person||'',t.jobId?jobName(t.jobId):'',t.note||'']);
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='so-tien-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Đã xuất file CSV');
}

/* ---------- Dữ liệu mẫu ---------- */
function demoData(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=a=>a[Math.floor(rnd()*a.length)];
  const D=blank();const A=[{id:'a1',name:'Tiền mặt',type:'cash',opening:1500000},{id:'a2',name:'Vietcombank',type:'bank',opening:18000000},{id:'a3',name:'MoMo',type:'ewallet',opening:400000},{id:'a4',name:'Thẻ VIB',type:'credit',opening:-2500000}];
  D.meta.accounts=A;D.meta.settings.defaultAcc='a3';
  D.meta.jobs=[{id:'j1',name:'Lifebuoy sampling Q4',client:'Unilever',created:1},{id:'j2',name:'Candid tiệc private',client:'Candid',created:2},{id:'j3',name:'KitKat pop-up',client:'Nestlé',created:0,closed:true}];
  D.meta.budgets={an:4500000,cafe:900000,dilai:1500000,muasam:2500000,giaitri:1000000};
  D.meta.bills=[{id:'b1',name:'Tiền nhà',amount:5500000,day:5,cat:'hoadon',acc:'a2',paid:{}},{id:'b2',name:'Tiền điện',amount:650000,day:15,cat:'hoadon',acc:'a2',paid:{}},{id:'b3',name:'Internet FPT',amount:230000,day:20,cat:'hoadon',acc:'a2',paid:{}},{id:'b4',name:'Netflix',amount:260000,day:28,cat:'hoadon',acc:'a4',paid:{}}];
  const add=t=>{t.id=uid();t.ts=Date.now();(D.tx[t.date.slice(0,7)]||(D.tx[t.date.slice(0,7)]={items:[]})).items.push(t)};
  const cur=curYM();const td=today();
  for(let k=5;k>=0;k--){
    const ym=addMonths(cur,-k);const last=k===0?new Date().getDate():daysIn(ym);
    add({type:'inc',amount:16500000,cat:'luong',acc:'a2',date:ym+'-05',note:'Lương tháng'});
    if(rnd()>.4)add({type:'inc',amount:Math.round(1+rnd()*5)*1e6,cat:'thuong',acc:'a2',date:ym+'-'+pad(Math.min(last,20)),note:'Thưởng dự án'});
    add({type:'inc',amount:Math.round(4+rnd()*8)*250000,cat:'ot',acc:'a1',date:ym+'-'+pad(Math.min(last,25)),note:'OT event cuối tuần'});
    for(let d=1;d<=last;d++){
      const date=ym+'-'+pad(d);
      if(rnd()<.7)add({type:'exp',amount:pick([39,45,49,55,65])*1000,cat:'cafe',acc:'a3',date,note:pick(['Highlands','Phúc Long','Katinat','Cà phê sữa đá'])});
      add({type:'exp',amount:pick([35,40,45,55,60,75,90])*1000,cat:'an',acc:pick(['a1','a3']),date,note:pick(['Cơm trưa','Phở','Bún bò','Cơm tấm','ShopeeFood'])});
      if(rnd()<.25)add({type:'exp',amount:pick([180,250,320,450])*1000,cat:'an',acc:'a4',date,note:pick(['Lẩu với bạn','Nhậu team','Nướng'])});
      if(rnd()<.5)add({type:'exp',amount:pick([22,28,32,45,60])*1000,cat:'dilai',acc:'a3',date,note:pick(['Grab','Be','Xăng'])});
      if(rnd()<.08)add({type:'exp',amount:pick([250,390,550,890])*1000,cat:'muasam',acc:'a4',date,note:pick(['Shopee','Uniqlo','Bách hoá Xanh'])});
      if(rnd()<.05)add({type:'exp',amount:pick([120,240,350])*1000,cat:'giaitri',acc:'a3',date,note:pick(['CGV','Karaoke','Bida'])});
    }
    for(const b of D.meta.bills){if(k>0||b.day<=new Date().getDate()){const date=ym+'-'+pad(Math.min(b.day,last));const t={type:'exp',amount:b.amount+Math.round((rnd()-.5)*b.amount*.2/1000)*1000,cat:'hoadon',acc:b.acc,date,note:b.name,billId:b.id};add(t);b.paid[ym]=t.id}}
  }
  add({type:'adv',amount:3500000,jobId:'j1',acc:'a2',date:addDays(td,-12),note:'Mua đá, nước cho team'});
  add({type:'adv',amount:1200000,jobId:'j1',acc:'a1',date:addDays(td,-5),note:'Grab chở POSM'});
  add({type:'ref',amount:3500000,jobId:'j1',acc:'a2',date:addDays(td,-2),note:'Kế toán hoàn đợt 1'});
  add({type:'adv',amount:2000000,jobId:'j2',acc:'a2',date:addDays(td,-1),note:'Cọc hoa trang trí'});
  add({type:'adv',amount:2800000,jobId:'j3',acc:'a2',date:addDays(td,-40),note:'Vật tư setup'});
  add({type:'ref',amount:2800000,jobId:'j3',acc:'a2',date:addDays(td,-30),note:'Đã quyết toán'});
  add({type:'lend',amount:2000000,person:'Minh',acc:'a2',date:addDays(td,-20),note:'Mượn đóng học',due:addDays(td,4)});
  add({type:'collect',amount:500000,person:'Minh',acc:'a3',date:addDays(td,-6)});
  add({type:'borrow',amount:1000000,person:'Chị Hà',acc:'a1',date:addDays(td,-9),note:'Mượn tạm cuối tháng'});
  add({type:'lend',amount:300000,person:'Tuấn',acc:'a3',date:addDays(td,-3),note:'Chia: Lẩu team Production'});
  D.splits.list.push({id:'s1',title:'Lẩu team Production',total:1200000,date:addDays(td,-3),payer:'me',myShare:300000,people:[{name:'Tuấn',share:300000},{name:'Linh',share:300000},{name:'Phát',share:300000}]});
  add({type:'lend',amount:300000,person:'Linh',acc:'a3',date:addDays(td,-3),note:'Chia: Lẩu team Production'});
  add({type:'lend',amount:300000,person:'Phát',acc:'a3',date:addDays(td,-3),note:'Chia: Lẩu team Production'});
  add({type:'collect',amount:300000,person:'Phát',acc:'a3',date:addDays(td,-1)});
  return D;
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('.sheet')){e.preventDefault();go(g.dataset.go,g.dataset.arg);return}
  const au=e.target.closest('[data-auth]');if(au){st.auth=au.dataset.auth;render();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='sheet-close'&&e.target!==el)return;
  switch(a){
    case'sheet-close':case'sheet-x':closeSheet();break;
    case'quick':txForm({});break;
    case'tx-new':txForm({type:el.dataset.k,jobId:el.dataset.job||null,amount:+el.dataset.a||0},{title:TYPES[el.dataset.k].label});break;
    case'debt-new':txForm({type:el.dataset.k,person:el.dataset.p||'',amount:+el.dataset.a||0},{title:TYPES[el.dataset.k].label});break;
    case'edit':{const t=findTx(el.dataset.id);if(t)txForm(JSON.parse(JSON.stringify(t)));break}
    case'ym':viewYM=addMonths(viewYM,+el.dataset.k);render();break;
    case'ft':filt.type=el.dataset.k;render();break;
    case'fc-clear':filt.cat=null;render();break;
    case'filter-cat':filt={type:'exp',q:'',cat:el.dataset.id};go('txns');break;
    case'acc-edit':accForm(el.dataset.id);break;
    case'bill-edit':billForm(el.dataset.id);break;
    case'pay-bill':payBill(el.dataset.id);break;
    case'job-new':jobForm();break;
    case'job-edit':jobForm(el.dataset.id);break;
    case'job-close':{const j=S.meta.jobs.find(x=>x.id===el.dataset.id);j.closed=!j.closed;save('meta');toast(j.closed?'Đã đánh dấu quyết toán':'Đã mở lại job');break}
    case'split-new':splitForm();break;
    case'ask-s':ask(el.textContent);break;
    case'ask':{const i=$('#askIn');const v=i.value;i.value='';ask(v);break}
    case'recap-ai':recapAI(el.dataset.ym);break;
    case'export':exportCsv();break;
    case'logout':signOut();break;
    case'look-rm':delete S.look[el.dataset.k];save('look');toast('Đã bỏ ảnh');break;
    case'demo-on':st.real=S;S=demoData();st.demo=true;ver++;go('home');render();break;
    case'demo-off':S=st.real||blank();st.real=null;st.demo=false;chat=[];ver++;go('home');render();break;
    case'ob-save':{
      const v=id=>{const x=parseMoney($('#'+id).value);return isNaN(x)?null:x};
      const acc=[];const c=v('ob-cash'),b=v('ob-bank'),m=v('ob-momo'),cr=v('ob-credit');
      acc.push({id:uid(),name:'Tiền mặt',type:'cash',opening:c||0});
      acc.push({id:uid(),name:$('#ob-bankname').value.trim()||'Ngân hàng',type:'bank',opening:b||0});
      if(m!==null)acc.push({id:uid(),name:'MoMo',type:'ewallet',opening:m});
      if(cr!==null)acc.push({id:uid(),name:'Thẻ tín dụng',type:'credit',opening:-Math.abs(cr)});
      S.meta.accounts=acc;S.meta.settings.defaultAcc=(m!==null?acc[2]:acc[0]).id;
      save('meta');toast('Xong. Bấm + để ghi khoản đầu tiên.');break}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.act==='q'){filt.q=el.value;clearTimeout(el._t);el._t=setTimeout(render,200)}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.look){const f=el.files[0];if(!f)return;const k=el.dataset.look;
    try{toast('Đang xử lý ảnh…');S.look=S.look||{};S.look[k]=k==='bg'?await shrinkImage(f,1080,2340):await shrinkImage(f,320,320,true);save('look');toast('Đã lưu ảnh')}catch(err){toast('Không đọc được ảnh này, thử ảnh khác nhé.')}
    return}
  if(el.dataset.act==='bg'){const v=parseMoney(el.value);if(isNaN(v)||v<=0)delete S.meta.budgets[el.dataset.k];else S.meta.budgets[el.dataset.k]=v;el.dataset.fresh=1;save('meta')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='askIn'){e.preventDefault();const v=e.target.value;e.target.value='';ask(v)}
});

readHash();
initStore();
</script>
